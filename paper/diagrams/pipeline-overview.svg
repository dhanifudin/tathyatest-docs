<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <style>
    .box { fill:#eef1ff; stroke:#6366f1; stroke-width:1.5; }
    .artifact { fill:#ecfdf5; stroke:#059669; stroke-width:1.5; }
    .lbl { font-size:12px; fill:#1e1b4b; }
    .lbl2 { font-size:10.5px; fill:#334155; }
    .edge { fill:none; stroke:#475569; stroke-width:1.5; marker-end:url(#arrow2); }
    .feedback { fill:none; stroke:#94a3b8; stroke-width:1.3; stroke-dasharray:4,3; marker-end:url(#arrow2); }
    .arrowhead { fill:#475569; }
    .caption { font-size:10.5px; fill:#334155; }
    .legend { font-size:10px; fill:#64748b; }
    @media (prefers-color-scheme: dark) {
      .box { fill:#1e1b4b; stroke:#818cf8; }
      .artifact { fill:#022c22; stroke:#34d399; }
      .lbl { fill:#e2e8f0; }
      .lbl2 { fill:#cbd5e1; }
      .edge { stroke:#94a3b8; }
      .feedback { stroke:#64748b; }
      .arrowhead { fill:#94a3b8; }
      .caption { fill:#cbd5e1; }
      .legend { fill:#94a3b8; }
    }
  </style>

  <!-- Row 1: Config -> Authenticated session -> Crawl queue -->
  <rect class="box" x="20" y="16" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="145" y="44"><tspan x="145" dy="0">Config</tspan></text>
  <text class="lbl2" text-anchor="middle" x="145" y="60"><tspan x="145" dy="0">roles, credentials,</tspan><tspan x="145" dy="13">coverage, data hints</tspan></text>

  <rect class="box" x="305" y="16" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="430" y="44">Authenticated session</text>
  <text class="lbl2" text-anchor="middle" x="430" y="60">Playwright login, one per role</text>

  <rect class="box" x="590" y="16" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="715" y="44">Crawl queue</text>
  <text class="lbl2" text-anchor="middle" x="715" y="60">same-origin URLs from the DOM</text>

  <path class="edge" d="M270,50 L305,50"/>
  <path class="edge" d="M555,50 L590,50"/>
  <path class="edge" d="M715,84 L715,151"/>

  <!-- Row 2 (right to left): DOM extraction -> Crawl contract -> Target selection -->
  <rect class="box" x="590" y="151" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="715" y="179">DOM extraction</text>
  <text class="lbl2" text-anchor="middle" x="715" y="195">forms, fields, links, buttons, tables</text>

  <rect class="artifact" x="305" y="151" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="430" y="179">Crawl contract</text>
  <text class="lbl2" text-anchor="middle" x="430" y="195">JSON record, one per role</text>

  <rect class="box" x="20" y="151" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="145" y="179">Target selection</text>
  <text class="lbl2" text-anchor="middle" x="145" y="195"><tspan x="145" dy="0">route, form, field, interaction,</tspan><tspan x="145" dy="13">pagination, RBAC</tspan></text>

  <path class="edge" d="M590,185 L555,185"/>
  <path class="edge" d="M305,185 L270,185"/>
  <path class="edge" d="M145,219 L145,286"/>

  <!-- Row 3: Oracle mapping -> Playwright specs -> Execution evidence -->
  <rect class="box" x="20" y="286" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="145" y="314">Oracle mapping</text>
  <text class="lbl2" text-anchor="middle" x="145" y="330">error state, no 500, redirect/403</text>

  <rect class="artifact" x="305" y="286" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="430" y="314">Playwright specs</text>
  <text class="lbl2" text-anchor="middle" x="430" y="330"><tspan x="430" dy="0">auth, forms, interactions,</tspan><tspan x="430" dy="13">pagination, RBAC</tspan></text>

  <rect class="artifact" x="590" y="286" width="250" height="68" rx="10"/>
  <text class="lbl" text-anchor="middle" x="715" y="314">Execution evidence</text>
  <text class="lbl2" text-anchor="middle" x="715" y="330">pass, fail, skip, runtime</text>

  <path class="edge" d="M270,320 L305,320"/>
  <path class="edge" d="M555,320 L590,320"/>

  <!-- Feedback: execution evidence informs the next crawl contract -->
  <path class="feedback" d="M715,286 L715,245 L460,245 L460,219"/>
  <text class="caption" x="495" y="241">informs next run</text>

  <text class="legend" x="20" y="420">solid = pipeline step &#183; green = stored artifact &#183; dashed = feeds the next evaluation run</text>
</svg>
